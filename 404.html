/* ═══════ LIGHT MODE BASE ═══════ */
:root {

--txt:#1A1A18; --txt2:#6B6A65; --txt3:#9C9B95;

}

/* ═══════ DARK MODE ═══════ */
[data-mode="dark"] {
--bg:#141413; --bg-card:#1E1E1C; --bg-hov:#2A2A27;
--txt:#EDECEA; --txt2:#A3A29C; --txt3:#6B6A65;
--brd:#2E2E2B;
--sh-sm:0 1px 2px rgba(0,0,0,.2); --sh-md:0 4px 16px rgba(0,0,0,.3);
--accent:var(--accent-dk); --accent-lt:var(--accent-lt-dk); --accent-hv:var(--accent-hv-dk);
--sec:var(--sec-dk); --sec-lt:var(--sec-lt-dk);
--tri:var(--tri-dk); --tri-lt:var(--tri-lt-dk);
--hi:var(--hi-dk); --hi-lt:var(--hi-lt-dk);
}
@media (prefers-color-scheme: dark) {
[data-mode="auto"] {
--bg:#141413; --bg-card:#1E1E1C; --bg-hov:#2A2A27;
--txt:#EDECEA; --txt2:#A3A29C; --txt3:#6B6A65;

--tri:var(--tri-dk); --tri-lt:var(--tri-lt-dk);
--hi:var(--hi-dk); --hi-lt:var(--hi-lt-dk);
}
}

body {
font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--txt);
line-height:1.6; min-height:100vh; transition:background .3s,color .3s;
display:flex; flex-direction:column;
}

.mode-toggle {
position:fixed; top:1rem; right:1rem; z-index:100;
display:flex; gap:0; background:var(--bg-card); border:1px solid var(--brd);
border-radius:100px; padding:3px; box-shadow:var(--sh-md); transition:all .3s;
}
.mode-toggle button {
all:unset; width:34px; height:34px; border-radius:50%;
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:background .2s; color:var(--txt3);
}
.mode-toggle button:hover { background:var(--bg-hov); }
.mode-toggle button.active { background:var(--accent-lt); color:var(--accent); }
.mode-toggle button svg { width:18px; height:18px; }

.wrap {
flex:1; display:flex; align-items:center; justify-content:center;
padding:4rem 1.5rem; position:relative; overflow:hidden;
}
.wrap::before {
content:''; position:absolute; inset:0; pointer-events:none; opacity:.6; transition:background .3s;
background:
radial-gradient(ellipse 60% 50% at 20% 40%, var(--accent-lt) 0%, transparent 70%),
radial-gradient(ellipse 50% 60% at 80% 30%, var(--hi-lt) 0%, transparent 70%);
}

.card {
position:relative; text-align:center; max-width:520px; width:100%;
}

.code {
display:inline-block; font-size:.75rem; font-weight:600; letter-spacing:.08em;
text-transform:uppercase; color:var(--accent); background:var(--accent-lt);
border:1px solid var(--accent); border-radius:100px; padding:.35rem 1rem;
margin-bottom:1.25rem; transition:all .3s;
}

h1 {
font-family:'DM Serif Display',Georgia,serif;
font-size:clamp(2rem,5vw,3rem); font-weight:400;
line-height:1.15; letter-spacing:-.02em; margin-bottom:.75rem;
}

.lead { font-size:1.05rem; color:var(--txt2); max-width:420px; margin:0 auto 2rem; }

.actions { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }

.btn {
display:inline-flex; align-items:center; gap:.5rem;
padding:.7rem 1.25rem; border-radius:100px;
text-decoration:none; font-weight:500; font-size:.95rem;
transition:all .15s ease; box-shadow:var(--sh-sm);
}
.btn svg { width:16px; height:16px; }
.btn.primary { background:var(--accent); color:var(--bg-card); border:1px solid var(--accent); }
.btn.primary:hover,.btn.primary:focus-visible { background:var(--accent-hv); border-color:var(--accent-hv); transform:translateY(-1px); box-shadow:var(--sh-md); }
.btn.ghost { background:var(--bg-card); color:var(--txt); border:1px solid var(--brd); }
.btn.ghost:hover,.btn.ghost:focus-visible { background:var(--bg-hov); border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--sh-md); }

footer {
text-align:center; padding:2rem 1.5rem 2.5rem;
border-top:1px solid var(--brd); color:var(--txt3); font-size:.85rem; transition:border-color .3s;
}
footer a { color:var(--txt2); text-decoration:none; font-weight:500; transition:color .15s; }
footer a:hover { color:var(--accent); }

@media (prefers-reduced-motion: no-preference) {
.code,h1,.lead,.actions { animation:fadeUp .5s ease both; }
.code { animation-delay:.15s; }
h1 { animation-delay:.22s; }
.lead { animation-delay:.3s; }
.actions { animation-delay:.4s; }
}
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

@media (max-width:600px) {
.mode-toggle { top:.65rem; right:.65rem; }
.mode-toggle button { width:30px; height:30px; }
}

<script>
function setMode(mode) {
document.documentElement.setAttribute('data-mode', mode);
localStorage.setItem('it9626-mode', mode);
updateButtons(mode);
}
function updateButtons(mode) {
document.getElementById('btn-light').classList.toggle('active', mode === 'light');
document.getElementById('btn-auto').classList.toggle('active', mode === 'auto');
document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
}
updateButtons(document.documentElement.getAttribute('data-mode') || 'auto');
